# Smart HR Enterprise — in-house installation on a single server.
# See docs/deployment/IN_HOUSE.md. Run from this directory:
#
#   cp .env.example .env        # then fill in every value marked CHANGE_ME
#   docker compose --profile setup run --rm db-init      # once: database and roles
#   docker compose --profile setup run --rm migrate      # every upgrade: schema migrations
#   docker compose up -d
#
# Only the web app and the API are published, on the host addresses set in .env. Put a TLS-terminating
# reverse proxy (your load balancer, nginx, Caddy, …) in front of both.

name: smart-hr

x-app-env: &app-env
  NODE_ENV: production
  DEPLOYMENT_MODE: inhouse
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://app_rw:${APP_DB_PASSWORD:?}@postgres:5432/smart_hr
  REDIS_URL: redis://redis:6379
  QUEUE_PREFIX: smarthr
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:?}
  LICENCE_PUBLIC_KEYS: ${LICENCE_PUBLIC_KEYS:?}
  SMTP_URL: ${SMTP_URL:?}
  MAIL_FROM: ${MAIL_FROM:?}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: smart_hr
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smart_hr']
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 30

  # Once per installation: creates the migrator and runtime roles. Idempotent.
  db-init:
    profiles: [setup]
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ../../packages/database/sql:/bootstrap:ro
    command:
      - sh
      - -c
      - >-
        psql -h postgres -U postgres -d smart_hr -v ON_ERROR_STOP=1
        -v migrator_password="$$MIGRATOR_DB_PASSWORD" -v app_password="$$APP_DB_PASSWORD"
        -f /bootstrap/bootstrap-roles.sql
    env_file: .env

  # Every install and upgrade, before starting the new version: applies migrations as the migrator role.
  migrate:
    profiles: [setup]
    image: ${IMAGE_REGISTRY:-smart-hr}/migrate:${SMART_HR_VERSION:?}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://app_migrator:${MIGRATOR_DB_PASSWORD:?}@postgres:5432/smart_hr
      DATABASE_MIGRATOR_URL: postgresql://app_migrator:${MIGRATOR_DB_PASSWORD:?}@postgres:5432/smart_hr

  api:
    image: ${IMAGE_REGISTRY:-smart-hr}/api:${SMART_HR_VERSION:?}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *app-env
      API_PORT: 4000
      CORS_ORIGINS: ${APP_PUBLIC_URL:?}
      MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:?}
      MFA_ENCRYPTION_KEY_ID: ${MFA_ENCRYPTION_KEY_ID:?}
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:?}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /var/lib/smart-hr/documents
    volumes:
      - documents:/var/lib/smart-hr/documents
    ports:
      - '${API_BIND:-127.0.0.1:4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    image: ${IMAGE_REGISTRY:-smart-hr}/worker:${SMART_HR_VERSION:?}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *app-env

  web:
    image: ${IMAGE_REGISTRY:-smart-hr}/web:${SMART_HR_VERSION:?}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - '${WEB_BIND:-127.0.0.1:3000}:3000'

volumes:
  postgres-data:
  redis-data:
  documents:
