name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: ./scripts/check-migrations.sh
      - name: Validate in-house compose file
        run: |
          sed 's/CHANGE_ME/ci-placeholder/g' deploy/inhouse/.env.example > deploy/inhouse/.env
          docker compose -f deploy/inhouse/docker-compose.yml --profile setup config --quiet
          rm deploy/inhouse/.env
          for f in deploy/inhouse/*.sh; do bash -n "$f"; done
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Migrations, integration and end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      # Real SMTP server with an HTTP API, so browser tests can open the emailed reset link.
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://app_rw:app_rw_ci@localhost:5432/smart_hr
      DATABASE_MIGRATOR_URL: postgresql://app_migrator:app_migrator_ci@localhost:5432/smart_hr
      SHADOW_DATABASE_URL: postgresql://app_migrator:app_migrator_ci@localhost:5432/smart_hr_shadow
      REDIS_URL: redis://localhost:6379
    steps:
      # Keys and passwords exist only for this run and are masked in the logs. Nothing is committed.
      - name: Generate run-time secrets
        run: |
          gen() { openssl rand -base64 "$1" | tr -d '\n'; }
          key=$(gen 32); echo "::add-mask::$key"; echo "MFA_ENCRYPTION_KEYS=ci:$key" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY_ID=ci" >> "$GITHUB_ENV"
          key=$(gen 32); echo "::add-mask::$key"; echo "DATA_ENCRYPTION_KEYS=ci:$key" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY_ID=ci" >> "$GITHUB_ENV"
          for who in ADMIN RESET MFA PLATFORM; do
            pw="e2e $(gen 18)"; echo "::add-mask::$pw"
            echo "E2E_${who}_PASSWORD=$pw" >> "$GITHUB_ENV"
            echo "E2E_${who}_EMAIL=$(echo "$who" | tr '[:upper:]' '[:lower:]')@e2e.smarthr.test" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Bootstrap databases and roles
        env:
          PGPASSWORD: postgres-ci
        run: |
          for db in smart_hr smart_hr_shadow; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${db}"
            psql -h localhost -U postgres -d "$db" \
              -v migrator_password=app_migrator_ci -v app_password=app_rw_ci \
              -f packages/database/sql/bootstrap-roles.sql
          done

      - name: Apply migrations to an empty database
        run: pnpm db:migrate:deploy
      # Compares the freshly migrated database with schema.prisma. Exit 2 = drift, exit 1 = error.
      - name: Check migrated database matches schema.prisma (drift)
        run: pnpm --filter @smart-hr/database db:migrate:check
      - name: Confirm migration history is clean
        run: pnpm db:migrate:status

      - run: pnpm test:integration

      - name: Build
        run: pnpm build

      # Same post-migration steps every deployment runs; each must be idempotent, so each runs twice.
      - name: Sync plan catalogue (twice, to prove idempotency)
        run: |
          node apps/api/dist/cli/sync-plan-catalogue.js
          node apps/api/dist/cli/sync-plan-catalogue.js

      - name: Create end-to-end test accounts
        run: |
          for who in ADMIN RESET MFA; do
            email_var="E2E_${who}_EMAIL"; pw_var="E2E_${who}_PASSWORD"
            BOOTSTRAP_TENANT_SLUG=e2e BOOTSTRAP_TENANT_NAME="E2E Organisation" \
            BOOTSTRAP_ADMIN_EMAIL="${!email_var}" BOOTSTRAP_ADMIN_NAME="E2E ${who}" \
            BOOTSTRAP_ADMIN_PASSWORD="${!pw_var}" \
              node apps/api/dist/cli/bootstrap.js
          done
          # A platform operator with an organisation of their own, which the platform tests change freely.
          BOOTSTRAP_TENANT_SLUG=e2e-platform BOOTSTRAP_TENANT_NAME="E2E Platform Org" \
          BOOTSTRAP_ADMIN_EMAIL="$E2E_PLATFORM_EMAIL" BOOTSTRAP_ADMIN_NAME="E2E Operator" \
          BOOTSTRAP_ADMIN_PASSWORD="$E2E_PLATFORM_PASSWORD" BOOTSTRAP_PLATFORM_ADMIN=true \
            node apps/api/dist/cli/bootstrap.js

      - name: Sync built-in roles (twice, to prove idempotency)
        run: |
          node apps/api/dist/cli/sync-system-roles.js
          node apps/api/dist/cli/sync-system-roles.js

      - name: Start API and worker
        run: |
          nohup node apps/api/dist/main.js > api.log 2>&1 &
          nohup node apps/worker/dist/main.js > worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/health/ready && exit 0; sleep 1; done
          cat api.log worker.log; exit 1
        env:
          NODE_ENV: test
          CORS_ORIGINS: http://localhost:3000
          APP_PUBLIC_URL: http://localhost:3000
          SMTP_URL: smtp://localhost:1025
          MAIL_FROM: Smart HR CI <no-reply@e2e.smarthr.test>
          # Deliver outbox emails quickly so browser tests can read them from Mailpit.
          EMAIL_SWEEP_INTERVAL_MS: '2000'
          # Every browser test signs in from the same address, faster than people would. The production
          # defaults stay in place; login rate limits and lockout are covered by auth.int.test.ts.
          AUTH_RATE_LIMIT_LOGIN_PER_IP: '1000'
      - run: pnpm --filter @smart-hr/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          MAILPIT_URL: http://localhost:8025
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
            worker.log
          retention-days: 7

  images:
    name: Container images build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - { app: api, file: docker/node-app.Dockerfile, target: runtime, args: APP=api }
          - { app: worker, file: docker/node-app.Dockerfile, target: runtime, args: APP=worker }
          - { app: migrate, file: docker/node-app.Dockerfile, target: migrate, args: APP=api }
          - {
              app: web,
              file: docker/web.Dockerfile,
              target: runtime,
              args: NEXT_PUBLIC_API_URL=http://localhost:4000,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.args }}
          push: false
          tags: smart-hr-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
